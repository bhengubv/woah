def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

// versionCode auto-derived from git commit count - every build unique,
// no manual bump. Falls back to 1 outside a git checkout.
def gitVersionCode = { ->
    try {
        def out = new ByteArrayOutputStream()
        exec { commandLine 'git', 'rev-list', '--count', 'HEAD'; standardOutput = out }
        return Integer.parseInt(out.toString().trim())
    } catch (Exception e) {
        return 1
    }
}

android {
    if (buildAsApplication) {
        namespace "net.thegeek.woah"
    }
    compileSdkVersion 34
    ndkVersion "29.0.14206865"
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        applicationId "net.thegeek.woah"
        versionCode gitVersionCode()
        versionName "1.0"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-21", "SUPPORT_WAVPACK=false", "SUPPORT_MP3_MINIMP3=false", "SUPPORT_OGG_STB=false", "SUPPORT_FLAC_DRFLAC=false"
                abiFilters 'arm64-v8a'
            }
            // cmake {
            //     arguments "-DANDROID_APP_PLATFORM=android-21", "-DANDROID_STL=c++_static"
            //     // abiFilters 'arm64-v8a'
            //     abiFilters 'arm64-v8a'
            // }
        }
    }
    // Release signing with nothing secret in the tree: point WOAH_KEYSTORE at the
    // keystore file and pass WOAH_KEYSTORE_PASS / WOAH_KEY_ALIAS (/ WOAH_KEY_PASS)
    // in the environment. Without them assembleRelease still builds and yields
    // app-release-unsigned.apk, to be signed elsewhere with apksigner.
    def releaseKeystore = System.getenv('WOAH_KEYSTORE')
    def canSignRelease = releaseKeystore != null && file(releaseKeystore).exists() \
            && System.getenv('WOAH_KEYSTORE_PASS') != null && System.getenv('WOAH_KEY_ALIAS') != null
    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('WOAH_KEYSTORE_PASS')
                keyAlias System.getenv('WOAH_KEY_ALIAS')
                keyPassword System.getenv('WOAH_KEY_PASS') ?: System.getenv('WOAH_KEYSTORE_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            ndkBuild {
                path 'jni/Android.mk'
            }
            // cmake {
            //     path 'jni/CMakeLists.txt'
            // }
        }
       
    }
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
